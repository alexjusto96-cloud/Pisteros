
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0038A8">
<title>Menú Principal - Pisteros F.C.</title>
<link rel="icon" type="image/jpeg" href="pisteros-logo.jpg">
<style>
:root{--blue:#0038A8;--green:#5C7A4B;--gray:#F4F6F9;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--gray);color:#1F2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:100%;max-width:420px;min-height:600px;background:white;border-radius:14px;padding:28px 24px;overflow:hidden;box-shadow:0 10px 25px #0038A81A}
.bar{height:8px;background:linear-gradient(90deg,#5C7A4B,#7A9E66,#5C7A4B);margin:-28px -24px 24px}
.header{border-bottom:2px solid var(--gray);padding-bottom:16px;margin-bottom:20px;color:var(--blue);font-size:1.1rem;font-weight:700}
h2{color:var(--green);font-size:1.1rem;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px}
.menu{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:12px;width:100%;padding:16px;text-align:left;background:#FAFAFA;border:1.5px solid #E5E7EB;border-left:5px solid var(--blue);border-radius:10px;cursor:pointer}
.card:active{transform:scale(.98);background:#EAF2E8}
.card.green{border-left-color:var(--green)}
.card.logout{border-left-color:var(--red);background:#FEF2F2}
.icon{font-size:1.5rem}
.card h3{font-size:1rem;color:var(--blue);margin-bottom:3px}
.card p{font-size:.8rem;color:#6B7280}
.card.logout h3{color:var(--red)}
</style>
</head>
<body>
<main class="app">
<div class="bar"></div>
<div class="header">Hola, <span id="userNameDisplay">Jugador</span> 👋</div>
<h2>Menú Principal</h2>
<nav class="menu">
  <button class="card" onclick="navegarA('valorar.html')">
    <span class="icon">⭐</span>
    <span><h3>Valorar partido</h3><p>Puntúa el desempeño del último encuentro</p></span>
  </button>
  <button class="card green" onclick="navegarA('equipo.html')">
    <span class="icon">📊</span>
    <span><h3>Rendimiento del Equipo</h3><p>Estadísticas colectivas de la temporada</p></span>
  </button>
  <button class="card" onclick="navegarA('jugador.html')">
    <span class="icon">🏃</span>
    <span><h3>Rendimiento del Jugador</h3><p>Tus métricas e historial individual</p></span>
  </button>
  <button class="card green" onclick="navegarA('password.html')">
    <span class="icon">🔒</span>
    <span><h3>Cambiar contraseña</h3><p>Actualiza tus credenciales de acceso</p></span>
  </button>
  <button class="card logout" onclick="logout()">
    <span class="icon">🚪</span>
    <span><h3>Cerrar sesión</h3><p>Salir de Pisteros F.C.</p></span>
  </button>
</nav>
</main>
<script>
const KEY="pisteros_user";
const user=sessionStorage.getItem(KEY)||localStorage.getItem(KEY);
if(!user)location.replace("index.html");
else document.getElementById("userNameDisplay").textContent=user;

function navegarA(pagina){
  location.href=pagina;
}
function logout(){
  sessionStorage.removeItem(KEY);
  localStorage.removeItem(KEY);
  location.replace("index.html");
}
</script>
</body>
</html>
