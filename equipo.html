<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rendimiento del Equipo - Pisteros F.C.</title>
  
  <meta name="theme-color" content="#0038A8">
  <link rel="icon" type="image/png" href="https://i.ibb.co/vzP3kYk/pisteros-logo.png">

  <style>
    :root {
      --primary-blue: #0038A8;
      --secondary-blue: #002570;
      --olive-green: #5C7A4B;
      --bg-gray: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border-radius: 14px;
      --box-shadow: 0 10px 25px -5px rgba(0, 56, 168, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      position: relative;
    }

    .laurel-bar {
      height: 8px;
      background: linear-gradient(90deg, var(--olive-green) 0%, #7A9E66 50%, var(--olive-green) 100%);
      margin: -20px -16px 16px -16px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg-gray);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .user-welcome {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .btn-back {
      background: none;
      border: 1.5px solid var(--primary-blue);
      color: var(--primary-blue);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .selector-container {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .selector-container label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .jornada-select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #D1D5DB;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-blue);
      background-color: #FAFAFA;
      outline: none;
      cursor: pointer;
    }

    .jornada-select:focus {
      border-color: var(--primary-blue);
    }

    /* GRID / TABLA DE EQUIPO */
    .grid-header {
      display: grid;
      grid-template-columns: 50px 1fr 90px;
      gap: 8px;
      align-items: center;
      padding: 8px 8px;
      background-color: var(--primary-blue);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 8px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 50px 1fr 90px;
      gap: 8px;
      align-items: center;
      padding: 8px 8px;
      border-bottom: 1px solid #E5E7EB;
      background: #FFFFFF;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    /* Fila destacada para la Media */
    .player-row.media-row {
      background-color: var(--light-green, #EAF2E8);
      border: 1.5px solid var(--olive-green);
      font-weight: 700;
      margin-top: 8px;
    }

    .player-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-photo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--olive-green);
      margin: 0 auto;
      display: block;
    }

    .player-score {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-align: center;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #E5E7EB;
      border-top-color: var(--primary-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="laurel-bar"></div>

    <div class="header-nav">
      <span class="user-welcome">Usuario: <span id="userNameDisplay">--</span></span>
      <button class="btn-back" onclick="window.location.href='menu.html'">← Menú</button>
    </div>

    <!-- SELECTOR DE JORNADA -->
    <div class="selector-container">
      <label for="jornadaSelector">Seleccionar Jornada</label>
      <select id="jornadaSelector" class="jornada-select" onchange="cambiarJornada()">
        <!-- Se rellena dinámicamente -->
      </select>
    </div>

    <!-- RULETA DE CARGA -->
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      Cargando rendimiento del equipo...
    </div>

    <!-- CONTENEDOR DEL GRID -->
    <div id="gridContainer" style="display: none;">
      <div class="grid-header">
        <span>Foto</span>
        <span>Nombre</span>
        <span>Valoración</span>
      </div>

      <div id="playersList"></div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
    const AVATAR_DEFAULT = "https://cdn-icons-png.flaticon.com/512/847/847969.png";
    let currentUser = "";

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = localStorage.getItem('pisteros_user');
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }
      document.getElementById('userNameDisplay').textContent = currentUser;
      cargarDatosEquipo();
    });

    // Cargar datos iniciales del equipo
    async function cargarDatosEquipo(jornadaSeleccionada = "") {
      mostrarCarga(true);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'getDatosEquipo',
            jornada: jornadaSeleccionada
          })
        });

        const data = await response.json();

        if (data.status === "success") {
          poblarSelectorJornadas(data.jornadas, data.jornadaActiva);
          renderizarGridEquipo(data.jugadores);
        } else {
          alert(data.message || "Error al cargar los datos del equipo.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Error de conexión con el servidor.");
      } finally {
        mostrarCarga(false);
      }
    }

    // Rellenar el listpicker con las jornadas disponibles
    function poblarSelectorJornadas(jornadas, jornadaActiva) {
      const select = document.getElementById('jornadaSelector');
      select.innerHTML = '';

      jornadas.forEach(jornada => {
        const option = document.createElement('option');
        option.value = jornada;
        option.textContent = jornada;
        if (jornada === jornadaActiva) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    // Dibujar el grid con las fotos, nombres, valoraciones y la media al final
    function renderizarGridEquipo(jugadores) {
      const listContainer = document.getElementById('playersList');
      listContainer.innerHTML = '';

      jugadores.forEach((item, index) => {
        const esMedia = (index === jugadores.length - 1); // El último elemento es la media
        const row = document.createElement('div');
        row.className = esMedia ? 'player-row media-row' : 'player-row';

        let fotoHtml = '';
        if (esMedia) {
          fotoHtml = `<div style="text-align: center; font-size: 1.2rem;">📊</div>`;
        } else {
          const fotoUrl = item.foto ? item.foto : AVATAR_DEFAULT;
          fotoHtml = `
            <img src="${fotoUrl}" class="player-photo" alt="${item.nombre}" 
                 onerror="this.onerror=null; this.src='${AVATAR_DEFAULT}';">
          `;
        }

        row.innerHTML = `
          <div>${fotoHtml}</div>
          <div class="player-name">${item.nombre}</div>
          <div class="player-score">${item.valoracion !== undefined && item.valoracion !== "" ? item.valoracion : "-"}</div>
        `;

        listContainer.appendChild(row);
      });
    }

    // Evento al cambiar de jornada en el listpicker
    function cambiarJornada() {
      const select = document.getElementById('jornadaSelector');
      const jornadaElegida = select.value;
      cargarDatosEquipo(jornadaElegida);
    }

    function mostrarCarga(mostrar) {
      document.getElementById('loading').style.display = mostrar ? 'flex' : 'none';
      document.getElementById('gridContainer').style.display = mostrar ? 'none' : 'block';
    }
  </script>
</body>
</html>
