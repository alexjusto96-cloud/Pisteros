<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cambiar Contraseña - Pisteros F.C.</title>
  
  <meta name="theme-color" content="#0038A8">
  <link rel="icon" type="image/png" href="https://i.ibb.co/vzP3kYk/pisteros-logo.png">

  <style>
    :root {
      --primary-blue: #0038A8;
      --secondary-blue: #002570;
      --olive-green: #5C7A4B;
      --bg-gray: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --success-color: #10B981;
      --error-color: #DC2626;
      --border-radius: 14px;
      --box-shadow: 0 10px 25px -5px rgba(0, 56, 168, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      position: relative;
    }

    .laurel-bar {
      height: 8px;
      background: linear-gradient(90deg, var(--olive-green) 0%, #7A9E66 50%, var(--olive-green) 100%);
      margin: -20px -16px 16px -16px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg-gray);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .user-welcome {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .btn-back {
      background: none;
      border: 1.5px solid var(--primary-blue);
      color: var(--primary-blue);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .page-title {
      text-align: center;
      color: var(--primary-blue);
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      border: 2px solid #D1D5DB;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background-color: #FAFAFA;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary-blue);
      background-color: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(0, 56, 168, 0.25);
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: var(--secondary-blue);
    }

    .btn-submit:disabled {
      background-color: #9CA3AF;
      cursor: not-allowed;
    }

    .status-msg {
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 16px;
      min-height: 20px;
    }

    .status-msg.success { color: var(--success-color); }
    .status-msg.error { color: var(--error-color); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="laurel-bar"></div>

    <div class="header-nav">
      <span class="user-welcome">Usuario: <span id="userNameDisplay">--</span></span>
      <button class="btn-back" onclick="window.location.href='menu.html'">← Menú</button>
    </div>

    <h1 class="page-title">Cambiar Contraseña</h1>

    <form id="passwordForm" onsubmit="procesarCambioPassword(event)">
      <div class="form-group">
        <label for="pass1">Nueva contraseña</label>
        <input type="password" id="pass1" class="form-input" placeholder="Ingresa la nueva contraseña" required>
      </div>

      <div class="form-group">
        <label for="pass2">Repite nueva contraseña</label>
        <input type="password" id="pass2" class="form-input" placeholder="Repite la nueva contraseña" required>
      </div>

      <button type="submit" id="btnEnviar" class="btn-submit">
        Enviar
      </button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
    let currentUser = "";

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = localStorage.getItem('pisteros_user');
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }
      document.getElementById('userNameDisplay').textContent = currentUser;
    });

    async function procesarCambioPassword(e) {
      e.preventDefault();

      const pass1 = document.getElementById('pass1').value.trim();
      const pass2 = document.getElementById('pass2').value.trim();
      const btnEnviar = document.getElementById('btnEnviar');
      const statusMsg = document.getElementById('statusMsg');

      statusMsg.textContent = "";
      statusMsg.className = "status-msg";

      if (!pass1 || !pass2) {
        statusMsg.textContent = "Por favor, rellenar ambos campos.";
        statusMsg.classList.add("error");
        return;
      }

      if (pass1 !== pass2) {
        statusMsg.textContent = "Las contraseñas no coinciden.";
        statusMsg.classList.add("error");
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = "Guardando...";

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'cambiarPassword',
            usuario: currentUser,
            nuevaPassword: pass1
          })
        });

        const data = await response.json();

        if (data.status === "success") {
          statusMsg.textContent = "¡Contraseña actualizada con éxito!";
          statusMsg.classList.add("success");
          
          document.getElementById('passwordForm').reset();

          setTimeout(() => {
            window.location.href = "menu.html";
          }, 1500);
        } else {
          statusMsg.textContent = data.message || "Error al actualizar la contraseña.";
          statusMsg.classList.add("error");
          btnEnviar.disabled = false;
          btnEnviar.textContent = "Enviar";
        }
      } catch (error) {
        console.error("Error:", error);
        statusMsg.textContent = "Error de conexión al servidor.";
        statusMsg.classList.add("error");
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Enviar";
      }
    }
  </script>
</body>
</html>
