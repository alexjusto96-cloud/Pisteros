
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0038A8">
<title>Cambiar Contraseña - Pisteros F.C.</title>
<link rel="icon" type="image/jpeg" href="pisteros-logo.jpg">
<style>
:root{--blue:#0038A8;--dark:#002570;--green:#5C7A4B;--gray:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--gray);color:#1F2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.app{width:100%;max-width:460px;background:white;border-radius:14px;padding:20px 16px;overflow:hidden;box-shadow:0 10px 25px #0038A81A}
.bar{height:8px;background:linear-gradient(90deg,#5C7A4B,#7A9E66,#5C7A4B);margin:-20px -16px 16px}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gray);padding-bottom:12px;margin-bottom:20px}
.user{font-size:.9rem;font-weight:700;color:var(--blue)}
.back{background:white;color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
h1{text-align:center;color:var(--blue);font-size:1.2rem;font-weight:800;text-transform:uppercase;margin-bottom:20px}
.group{margin-bottom:16px}
.group label{display:block;color:var(--blue);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field{width:100%;padding:14px;border:2px solid #D1D5DB;border-radius:10px;background:#FAFAFA;font-size:1rem;outline:none}
.field:focus{border-color:var(--blue);background:white}
.submit{width:100%;padding:16px;margin-top:10px;background:var(--blue);color:white;border:0;border-radius:10px;font-size:1rem;font-weight:700;text-transform:uppercase;cursor:pointer}
.submit:active{background:var(--dark)}
.submit:disabled{background:#9CA3AF}
.status{text-align:center;font-size:.85rem;font-weight:700;min-height:20px;margin-top:16px}
.status.success{color:#10B981}
.status.error{color:#DC2626}
</style>
</head>
<body>
<main class="app">
<div class="bar"></div>
<div class="header">
  <span class="user">Usuario: <span id="userNameDisplay">--</span></span>
  <button class="back" onclick="location.href='menu.html'">← Menú</button>
</div>
<h1>Cambiar Contraseña</h1>
<form id="passwordForm">
  <div class="group">
    <label for="passActual">Contraseña actual</label>
    <input class="field" type="password" id="passActual" autocomplete="current-password" required>
  </div>
  <div class="group">
    <label for="pass1">Nueva contraseña</label>
    <input class="field" type="password" id="pass1" autocomplete="new-password" required>
  </div>
  <div class="group">
    <label for="pass2">Repite nueva contraseña</label>
    <input class="field" type="password" id="pass2" autocomplete="new-password" required>
  </div>
  <button id="btnEnviar" class="submit" type="submit">Guardar contraseña</button>
</form>
<div id="statusMsg" class="status" role="alert"></div>
</main>

<script>
const API="https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
const user=sessionStorage.getItem("pisteros_user")||localStorage.getItem("pisteros_user");

if(!user)location.replace("index.html");
else document.getElementById("userNameDisplay").textContent=user;

document.getElementById("passwordForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const actual=document.getElementById("passActual").value;
  const nueva=document.getElementById("pass1").value;
  const repetir=document.getElementById("pass2").value;
  const btn=document.getElementById("btnEnviar");
  const status=document.getElementById("statusMsg");

  status.className="status";
  status.textContent="";

  function error(msg){
    status.textContent=msg;
    status.classList.add("error");
  }

  if(!actual||!nueva||!repetir){
    error("Completa todos los campos.");
    return;
  }
  if(nueva!==repetir){
    error("Las contraseñas nuevas no coinciden.");
    return;
  }
  if(actual===nueva){
    error("La nueva contraseña debe ser diferente de la actual.");
    return;
  }

  btn.disabled=true;
  btn.textContent="Guardando...";

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"cambiarPassword",
        usuario:user,
        passwordActual:actual,
        nuevaPassword:nueva
      })
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();

    if(data.status==="success"){
      status.textContent="¡Contraseña actualizada correctamente!";
      status.classList.add("success");
      document.getElementById("passwordForm").reset();
      setTimeout(()=>location.href="menu.html",1500);
    }else{
      error(data.message||"No se pudo cambiar la contraseña.");
    }
  }catch(err){
    console.error(err);
    error("Error de conexión con el servidor.");
  }finally{
    btn.disabled=false;
    btn.textContent="Guardar contraseña";
  }
});
</script>
</body>
</html>
