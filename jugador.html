
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0038A8">
<title>Rendimiento Individual - Pisteros F.C.</title>
<link rel="icon" type="image/jpeg" href="pisteros-logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--blue:#0038A8;--green:#5C7A4B;--gray:#F4F6F9}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--gray);color:#1F2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.app{width:100%;max-width:460px;background:white;border-radius:14px;padding:20px 16px;overflow:hidden;box-shadow:0 10px 25px #0038A81A}
.bar{height:8px;background:linear-gradient(90deg,#5C7A4B,#7A9E66,#5C7A4B);margin:-20px -16px 16px}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gray);padding-bottom:12px;margin-bottom:16px}
.user{font-size:.9rem;font-weight:700;color:var(--blue)}
.back{background:white;color:var(--blue);border:1.5px solid var(--blue);border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.selector{margin-bottom:16px}
.selector label{display:block;color:var(--blue);font-size:.85rem;font-weight:700;text-transform:uppercase;margin-bottom:6px}
.selector select{width:100%;padding:12px 14px;border:2px solid #D1D5DB;border-radius:10px;color:var(--blue);font-size:1rem;font-weight:700;background:#FAFAFA}
.grid-header,.table-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;text-align:center;padding:10px 12px}
.grid-header{background:var(--blue);color:white;border-radius:8px;font-size:.8rem;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.table-row{border-bottom:1px solid #E5E7EB;border-radius:6px;margin-bottom:4px;font-size:.9rem}
.score{font-size:1rem;font-weight:800;color:var(--blue)}
.chart-card{margin-top:20px;background:#FAFAFA;border:1.5px solid #E5E7EB;border-radius:12px;padding:14px}
.chart-title{color:var(--blue);font-size:.85rem;font-weight:800;text-transform:uppercase;text-align:center;margin-bottom:12px}
.chart-area{position:relative;height:240px;width:100%}
.loading{text-align:center;padding:40px;color:#6B7280;font-weight:600}
.spinner{width:36px;height:36px;margin:0 auto 12px;border:4px solid #E5E7EB;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="app">
<div class="bar"></div>
<div class="header">
  <span class="user">Usuario: <span id="userNameDisplay">--</span></span>
  <button class="back" onclick="location.href='menu.html'">← Menú</button>
</div>
<div class="selector">
  <label for="playerSelector">Seleccionar Jugador</label>
  <select id="playerSelector" onchange="cambiarJugador()"></select>
</div>
<div id="loading" class="loading"><div class="spinner"></div>Cargando rendimiento individual...</div>
<div id="dataContainer" style="display:none">
  <div class="grid-header"><span>Jornada</span><span>Valoración</span></div>
  <div id="tableBody"></div>
  <div class="chart-card">
    <div class="chart-title">Evolución del Rendimiento</div>
    <div class="chart-area"><canvas id="performanceChart"></canvas></div>
  </div>
</div>
<div id="errorMsg" style="text-align:center;color:#DC2626;font-weight:600"></div>
</main>

<script>
const API="https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
const user=sessionStorage.getItem("pisteros_user")||localStorage.getItem("pisteros_user");
let chart=null;

if(!user)location.replace("index.html");
else{
  document.getElementById("userNameDisplay").textContent=user;
  cargarDatosJugador(user);
}

async function cargarDatosJugador(jugador){
  document.getElementById("loading").style.display="block";
  document.getElementById("dataContainer").style.display="none";
  document.getElementById("errorMsg").textContent="";

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"getDatosJugador",jugador})
    });
    if(!res.ok)throw new Error("Error HTTP");
    const data=await res.json();
    if(data.status!=="success")throw new Error(data.message||"Error");

    const select=document.getElementById("playerSelector");
    select.replaceChildren();
    (data.listaJugadores||[]).forEach(nombre=>{
      const opt=document.createElement("option");
      opt.value=nombre;
      opt.textContent=nombre;
      opt.selected=nombre===data.jugadorActivo;
      select.appendChild(opt);
    });

    renderizarTabla(data.historial||[]);
    renderizarGrafico(data.historial||[]);
    document.getElementById("dataContainer").style.display="block";
  }catch(err){
    console.error(err);
    document.getElementById("errorMsg").textContent="No se pudieron obtener los datos del jugador.";
  }finally{
    document.getElementById("loading").style.display="none";
  }
}

function renderizarTabla(historial){
  const table=document.getElementById("tableBody");
  table.replaceChildren();

  if(!historial.length){
    const row=document.createElement("div");
    row.className="table-row";
    row.textContent="Sin datos";
    table.appendChild(row);
    return;
  }

  historial.forEach(item=>{
    const row=document.createElement("div");
    row.className="table-row";
    const jornada=document.createElement("span");
    jornada.textContent=item.jornada;
    const score=document.createElement("span");
    score.className="score";
    score.textContent=item.valoracion==null||item.valoracion===""?"-":item.valoracion;
    row.append(jornada,score);
    table.appendChild(row);
  });
}

function renderizarGrafico(historial){
  const ordenados=[...historial].reverse();
  const labels=[];
  const values=[];

  ordenados.forEach(item=>{
    if(item.valoracion==null||String(item.valoracion).trim()==="")return;
    const valor=Number(String(item.valoracion).replace(",","."));
    if(Number.isFinite(valor)){
      labels.push(item.jornada);
      values.push(valor);
    }
  });

  if(chart){chart.destroy();chart=null}
  if(typeof Chart==="undefined"){
    document.getElementById("errorMsg").textContent="No se ha podido cargar el gráfico.";
    return;
  }

  chart=new Chart(document.getElementById("performanceChart"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"Puntuación",
        data:values,
        borderColor:"#0038A8",
        backgroundColor:"rgba(0,56,168,.1)",
        borderWidth:3,
        pointBackgroundColor:"#5C7A4B",
        pointBorderColor:"#0038A8",
        pointRadius:6,
        pointHoverRadius:8,
        tension:.3,
        fill:true
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{
          min:0,max:3,
          ticks:{stepSize:1,font:{weight:"bold"}},
          grid:{color:"#E5E7EB"}
        },
        x:{
          ticks:{font:{weight:"bold"}},
          grid:{display:false}
        }
      }
    }
  });
}

function cambiarJugador(){
  cargarDatosJugador(document.getElementById("playerSelector").value);
}
</script>
</body>
</html>
