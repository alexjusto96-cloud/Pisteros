<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rendimiento Individual - Pisteros F.C.</title>
  
  <meta name="theme-color" content="#0038A8">
  <link rel="icon" type="image/png" href="https://i.ibb.co/vzP3kYk/pisteros-logo.png">

  <!-- Chart.js para el gráfico de evolución -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary-blue: #0038A8;
      --secondary-blue: #002570;
      --olive-green: #5C7A4B;
      --bg-gray: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-muted: #6B7280;
      --border-radius: 14px;
      --box-shadow: 0 10px 25px -5px rgba(0, 56, 168, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      position: relative;
    }

    .laurel-bar {
      height: 8px;
      background: linear-gradient(90deg, var(--olive-green) 0%, #7A9E66 50%, var(--olive-green) 100%);
      margin: -20px -16px 16px -16px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg-gray);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .user-welcome {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .btn-back {
      background: none;
      border: 1.5px solid var(--primary-blue);
      color: var(--primary-blue);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .selector-container {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .selector-container label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #D1D5DB;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-blue);
      background-color: #FAFAFA;
      outline: none;
      cursor: pointer;
    }

    .player-select:focus {
      border-color: var(--primary-blue);
    }

    /* TABLA DE JORNADA Y VALORACIÓN */
    .grid-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      background-color: var(--primary-blue);
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 8px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #E5E7EB;
      background: #FFFFFF;
      border-radius: 6px;
      margin-bottom: 4px;
      text-align: center;
    }

    .col-jornada {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .col-valoracion {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-blue);
    }

    /* SECCIÓN DEL GRÁFICO */
    .chart-card {
      margin-top: 20px;
      background: #FAFAFA;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px;
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary-blue);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #E5E7EB;
      border-top-color: var(--primary-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="laurel-bar"></div>

    <div class="header-nav">
      <span class="user-welcome">Usuario: <span id="userNameDisplay">--</span></span>
      <button class="btn-back" onclick="window.location.href='menu.html'">← Menú</button>
    </div>

    <!-- SELECTOR DE JUGADOR -->
    <div class="selector-container">
      <label for="playerSelector">Seleccionar Jugador</label>
      <select id="playerSelector" class="player-select" onchange="cambiarJugador()">
        <!-- Se rellena dinámicamente -->
      </select>
    </div>

    <!-- RULETA DE CARGA -->
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      Cargando rendimiento individual...
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="dataContainer" style="display: none;">
      
      <!-- TABLA DE JORNADA / VALORACIÓN -->
      <div class="grid-header">
        <span>Jornada</span>
        <span>Valoración</span>
      </div>
      <div id="tableBody"></div>

      <!-- GRÁFICO DE EVOLUCIÓN -->
      <div class="chart-card">
        <div class="chart-title">Evolución del Rendimiento</div>
        <canvas id="performanceChart" height="200"></canvas>
      </div>

    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
    let currentUser = "";
    let myChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = localStorage.getItem('pisteros_user');
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }
      document.getElementById('userNameDisplay').textContent = currentUser;
      cargarDatosJugador(currentUser);
    });

    async function cargarDatosJugador(jugadorSeleccionado) {
      mostrarCarga(true);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'getDatosJugador',
            jugador: jugadorSeleccionado
          })
        });

        const data = await response.json();

        if (data.status === "success") {
          poblarSelectorJugadores(data.listaJugadores, data.jugadorActivo);
          renderizarTabla(data.historial);
          renderizarGrafico(data.historial);
        } else {
          alert(data.message || "Error al obtener los datos del jugador.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Error de conexión al obtener los datos.");
      } finally {
        mostrarCarga(false);
      }
    }

    function poblarSelectorJugadores(lista, activo) {
      const select = document.getElementById('playerSelector');
      select.innerHTML = '';

      lista.forEach(nombre => {
        const option = document.createElement('option');
        option.value = nombre;
        option.textContent = nombre;
        if (nombre.toLowerCase() === activo.toLowerCase()) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    function renderizarTabla(historial) {
      const container = document.getElementById('tableBody');
      container.innerHTML = '';

      if (historial.length === 0) {
        container.innerHTML = '<div class="table-row"><span>-</span><span>Sin datos</span></div>';
        return;
      }

      historial.forEach(item => {
        const row = document.createElement('div');
        row.className = 'table-row';
        
        let displayVal = item.valoracion;
        if (displayVal === "" || displayVal === null || displayVal === undefined) {
          displayVal = "-";
        }

        row.innerHTML = `
          <div class="col-jornada">${item.jornada}</div>
          <div class="col-valoracion">${displayVal}</div>
        `;
        container.appendChild(row);
      });
    }

    function renderizarGrafico(historial) {
      // Invertir orden para que la jornada más vieja quede a la izquierda y la más reciente a la derecha
      const historialCronologico = [...historial].reverse();

      const labels = [];
      const dataPoints = [];

      historialCronologico.forEach(item => {
        const valStr = String(item.valoracion).trim();
        // Si no está convocado / valor en blanco, se omite en el gráfico
        if (valStr !== "" && valStr !== null && valStr !== undefined) {
          const numVal = parseFloat(valStr.replace(',', '.'));
          if (!isNaN(numVal)) {
            labels.push(item.jornada);
            dataPoints.push(numVal);
          }
        }
      });

      const ctx = document.getElementById('performanceChart').getContext('2d');

      if (myChartInstance) {
        myChartInstance.destroy();
      }

      myChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Puntuación',
            data: dataPoints,
            borderColor: '#0038A8',
            backgroundColor: 'rgba(0, 56, 168, 0.1)',
            borderWidth: 3,
            pointBackgroundColor: '#5C7A4B',
            pointBorderColor: '#0038A8',
            pointRadius: 6,
            pointHoverRadius: 8,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              min: 0,
              max: 3,
              ticks: {
                stepSize: 1,
                font: { weight: 'bold' }
              },
              grid: { color: '#E5E7EB' }
            },
            x: {
              ticks: { font: { weight: 'bold' } },
              grid: { display: false }
            }
          }
        }
      });
    }

    function cambiarJugador() {
      const select = document.getElementById('playerSelector');
      cargarDatosJugador(select.value);
    }

    function mostrarCarga(mostrar) {
      document.getElementById('loading').style.display = mostrar ? 'flex' : 'none';
      document.getElementById('dataContainer').style.display = mostrar ? 'block' : 'none';
    }
  </script>
</body>
</html>
