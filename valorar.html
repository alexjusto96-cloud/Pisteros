
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0038A8">
<title>Valorar Partido - Pisteros F.C.</title>
<link rel="icon" type="image/jpeg" href="pisteros-logo.jpg">
<style>
:root{--blue:#0038A8;--dark:#002570;--green:#5C7A4B;--gray:#F4F6F9;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--gray);color:#1F2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.app{width:100%;max-width:460px;background:white;border-radius:14px;padding:20px 16px;overflow:hidden;box-shadow:0 10px 25px #0038A81A}
.bar{height:8px;background:linear-gradient(90deg,#5C7A4B,#7A9E66,#5C7A4B);margin:-20px -16px 16px}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gray);padding-bottom:12px;margin-bottom:16px}
.user{font-size:.9rem;font-weight:700;color:var(--blue)}
.back{border:1.5px solid var(--blue);background:white;color:var(--blue);padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer}
h1{text-align:center;color:var(--blue);font-size:1.3rem;font-weight:800;text-transform:uppercase;margin-bottom:16px}
.grid-header,.player-row{display:grid;grid-template-columns:50px minmax(0,1fr) 50px 100px;gap:6px;align-items:center;text-align:center}
.grid-header{background:var(--blue);color:white;padding:8px 6px;border-radius:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.player-row{padding:8px 6px;border-bottom:1px solid #E5E7EB;border-radius:6px;margin-bottom:4px}
.player-row.disabled{background:#F3F4F6;opacity:.5}
.player-row input{width:20px;height:20px;accent-color:var(--blue)}
.player-name{font-size:.88rem;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1.5px solid var(--green)}
.picker-select{width:100%;padding:8px 4px;border:1.5px solid #D1D5DB;border-radius:8px;background:#FAFAFA;color:var(--blue);font-size:.85rem;font-weight:700;text-align:center}
.submit{width:100%;margin-top:20px;padding:16px;background:var(--blue);color:white;border:0;border-radius:10px;font-size:1rem;font-weight:700;text-transform:uppercase;cursor:pointer}
.submit:disabled{background:#9CA3AF}
.status{text-align:center;margin-top:12px;font-size:.85rem;font-weight:700;min-height:20px;color:var(--red)}
.loading{text-align:center;padding:30px;color:#6B7280;font-weight:600}
#successView{display:none;flex-direction:column;align-items:center;text-align:center;padding:40px 20px}
.success-title{color:#10B981;font-size:1.3rem;font-weight:800;text-transform:uppercase;margin:16px 0 24px}
.success-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.secondary{background:var(--green)}
</style>
</head>
<body>
<main class="app">
<div class="bar"></div>
<div class="header">
  <span class="user">Usuario: <span id="userNameDisplay">--</span></span>
  <button class="back" onclick="location.href='menu.html'">← Menú</button>
</div>

<section id="formContainerView">
  <h1 id="jornadaTitle">Cargando...</h1>
  <div id="loading" class="loading">Obteniendo plantilla de jugadores...</div>
  <div id="gridContainer" style="display:none">
    <div class="grid-header">
      <span>Conv.</span><span>Jugador</span><span>Foto</span><span>Valoración</span>
    </div>
    <div id="playersList"></div>
    <button id="btnEnviar" class="submit" onclick="enviarPuntuaciones()">Enviar Puntuaciones</button>
    <div id="statusMsg" class="status" role="alert"></div>
  </div>
</section>

<section id="successView">
  <div style="font-size:3.5rem">✅</div>
  <h2 class="success-title">¡Valoraciones enviadas!</h2>
  <div class="success-buttons">
    <button class="submit" onclick="location.href='menu.html'">Volver al menú</button>
    <button class="submit secondary" onclick="location.reload()">Nueva valoración</button>
  </div>
</section>
</main>

<script>
const API="https://script.google.com/macros/s/AKfycbzyIwS_zvaVUUwaVQkiDFKwPPOIV8EEOe5wWQIRBb_j0WfcO_nnqKMpzp4enFrxlPpc1Q/exec";
const AVATAR="https://cdn-icons-png.flaticon.com/512/847/847969.png";
const user=sessionStorage.getItem("pisteros_user")||localStorage.getItem("pisteros_user");
let jugadoresActuales=[];

if(!user)location.replace("index.html");
else{
  document.getElementById("userNameDisplay").textContent=user;
  cargarDatosFormulario();
}

async function peticion(datos){
  const r=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(datos)
  });
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

async function cargarDatosFormulario(){
  try{
    const data=await peticion({action:"getDatosValoracion"});
    if(data.status!=="success")throw new Error(data.message||"Error");
    document.getElementById("jornadaTitle").textContent=data.jornadaTitle||"Valorar Partido";
    renderizarGrid(data.jugadores||[]);
  }catch(err){
    console.error(err);
    document.getElementById("jornadaTitle").textContent="Error al cargar";
    document.getElementById("statusMsg").textContent="No se han podido obtener los jugadores.";
  }finally{
    document.getElementById("loading").style.display="none";
    document.getElementById("gridContainer").style.display="block";
  }
}

function renderizarGrid(jugadores){
  jugadoresActuales=jugadores;
  const list=document.getElementById("playersList");
  list.replaceChildren();

  jugadores.forEach((jugador,i)=>{
    const row=document.createElement("div");
    row.className="player-row";
    row.id="row-"+i;

    const checkBox=document.createElement("div");
    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=true;
    check.id="check-"+i;
    check.addEventListener("change",()=>toggleFila(i));
    checkBox.appendChild(check);

    const name=document.createElement("div");
    name.className="player-name";
    name.textContent=jugador.nombre;

    const photoBox=document.createElement("div");
    const img=document.createElement("img");
    img.className="player-photo";
    img.src=jugador.foto||AVATAR;
    img.alt=jugador.nombre;
    img.onerror=()=>{img.onerror=null;img.src=AVATAR};
    photoBox.appendChild(img);

    const scoreBox=document.createElement("div");
    const select=document.createElement("select");
    select.id="select-"+i;
    select.className="picker-select";
    [["","--"],["-","-"],["1","♠"],["2","♠♠"],["3","♠♠♠"]].forEach(([v,t])=>{
      const opt=document.createElement("option");
      opt.value=v;opt.textContent=t;select.appendChild(opt);
    });
    scoreBox.appendChild(select);

    row.append(checkBox,name,photoBox,scoreBox);
    list.appendChild(row);
  });
}

function toggleFila(i){
  const checked=document.getElementById("check-"+i).checked;
  const row=document.getElementById("row-"+i);
  const select=document.getElementById("select-"+i);
  row.classList.toggle("disabled",!checked);
  select.disabled=!checked;
  if(!checked)select.value="";
}

async function enviarPuntuaciones(){
  const btn=document.getElementById("btnEnviar");
  const status=document.getElementById("statusMsg");
  const valoraciones={};

  jugadoresActuales.forEach((jugador,i)=>{
    const checked=document.getElementById("check-"+i).checked;
    const select=document.getElementById("select-"+i);
    valoraciones[jugador.nombre]=checked?select.value:"";
  });

  btn.disabled=true;
  btn.textContent="Enviando...";
  status.textContent="";

  try{
    const data=await peticion({action:"guardarValoracion",valoraciones});
    if(data.status!=="success")throw new Error(data.message||"Error al guardar");
    document.getElementById("formContainerView").style.display="none";
    document.getElementById("successView").style.display="flex";
  }catch(err){
    console.error(err);
    status.textContent=err.message||"Error de conexión al enviar.";
  }finally{
    btn.disabled=false;
    btn.textContent="Enviar Puntuaciones";
  }
}
</script>
</body>
</html>
